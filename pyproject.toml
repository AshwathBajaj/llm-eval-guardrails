[project]
name = "llmeval"
version = "0.1.0"
description = "Evaluate RAG and LLM outputs, and enforce guardrails before they reach a user."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ashwath Bajaj" }]
keywords = ["llm", "rag", "evaluation", "guardrails", "hallucination"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "jsonschema>=4.23",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
docs = [
  "fpdf2>=2.8",
]
neural = [
  "sentence-transformers>=3.0",
]
data = [
  "datasets>=2.19",
]

[project.scripts]
llmeval = "llmeval.cli:app"

[project.urls]
Homepage = "https://github.com/AshwathBajaj/llm-eval-guardrails"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmeval = ["demo/*.html", "report/*.html", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["llmeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
